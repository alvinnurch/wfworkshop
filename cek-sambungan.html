<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cek sambungan Supabase</title>
<style>
  body { margin:0; background:#F6F1EA; color:#1B1714; font-family:system-ui,sans-serif; padding:36px 18px; }
  .box { max-width:760px; margin:0 auto; background:#FFF; border:1px solid #E6DFD6; border-radius:14px; padding:28px; }
  h1 { font-size:22px; margin:0 0 14px; }
  .row { display:flex; gap:12px; padding:12px 0; border-top:1px solid #F1EBE3; font-size:14.5px; line-height:1.5; }
  .row:first-of-type { border-top:none; }
  .tag { flex:none; width:24px; font-size:17px; }
  code { background:#F3EDE5; padding:2px 6px; border-radius:4px; font-size:13px; word-break:break-all; }
  .fix { background:#FBEFEF; border:1px solid #F0C9CC; color:#8E1018; border-radius:10px; padding:14px 16px; margin-top:18px; font-size:14px; line-height:1.6; }
  .ok { background:#EEF5E9; border:1px solid #CFE2C2; color:#2C4D18; border-radius:10px; padding:14px 16px; margin-top:18px; font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="box">
  <h1>Cek sambungan Supabase</h1>
  <div id="hasil"></div>
  <div id="saran"></div>
</div>

<script src="config.js"></script>
<script
const H = document.getElementById('hasil'), S = document.getElementById('saran');
const rows = [];
function add(ok, label, detail) {
  rows.push('<div class="row"><span class="tag">' + (ok === null ? '…' : ok ? '\u2713' : '\u2717') + '</span><div><strong>' + label + '</strong>' + (detail ? '<br>' + detail : '') + '</div></div>');
  H.innerHTML = rows.join('');
}
function saran(kelas, html) { S.innerHTML = '<div class="' + kelas + '">' + html + '</div>'; }

(async () => {
  // 1. config.js terbaca?
  const cfg = window.SUPABASE;
  if (!cfg) {
    add(false, 'config.js tidak memuat window.SUPABASE', 'Berkas config.js yang tayang masih versi lama (berisi <code>WORKSHOP_API</code>), atau belum terunggah.');
    return saran('fix', 'Unggah ulang <code>config.js</code> dari folder <code>deploy-supabase</code>, lalu muat ulang halaman ini dengan Ctrl+Shift+R.');
  }
  add(true, 'config.js terbaca');

  // 2. nilai terisi?
  const url = String(cfg.url || '').trim(), key = String(cfg.anonKey || '').trim();
  if (!url || !key) {
    add(false, 'url / anonKey masih kosong', 'url: <code>' + (url || '(kosong)') + '</code><br>anonKey: <code>' + (key ? key.slice(0, 12) + '…' : '(kosong)') + '</code>');
    return saran('fix', 'Isi keduanya di <code>config.js</code>: Supabase → Project Settings → API.');
  }
  add(true, 'url & anonKey terisi', 'url: <code>' + url + '</code><br>anonKey: <code>' + key.slice(0, 14) + '… (' + key.length + ' karakter)</code>');

  // 3. supabase-store.js termuat?
  let storeOk = false;
  try {
    const r = await fetch('supabase-store.js', { cache: 'no-store' });
    storeOk = r.ok;
    add(r.ok, 'supabase-store.js ' + (r.ok ? 'tersedia' : 'TIDAK ditemukan (HTTP ' + r.status + ')'),
      r.ok ? '' : 'Berkas ini yang menyambungkan halaman ke Supabase.');
  } catch (e) { add(false, 'supabase-store.js tidak dapat diperiksa', String(e)); }

  // 4. server Supabase menjawab?
  try {
    const r = await fetch(url.replace(/\/+$/, '') + '/rest/v1/workshop_config?id=eq.1&select=doc', {
      headers: { apikey: key, Authorization: 'Bearer ' + key }
    });
    const txt = await r.text();
    if (r.ok) {
      let n = 0;
      try { const j = JSON.parse(txt); n = ((j[0] && j[0].doc && j[0].doc.sessions) || []).length; } catch (e) {}
      add(true, 'Supabase menjawab', n + ' sesi tersimpan di basis data.');
      if (!storeOk) return saran('fix', 'Supabase sudah siap, tetapi <code>supabase-store.js</code> belum terunggah — itu sebabnya halaman tetap mode demo. Unggah berkas itu ke akar situs.');
      return saran('ok', 'Semua siap. Buka <a href="index.html">index.html</a> dan muat ulang dengan Ctrl+Shift+R. Bila di sana masih tertulis "Mode demo", berarti <code>index.html</code> yang tayang masih versi lama — unggah ulang yang dari folder <code>deploy-supabase</code>.');
    }
    add(false, 'Supabase menolak permintaan (HTTP ' + r.status + ')', '<code>' + txt.slice(0, 300) + '</code>');
    if (r.status === 401) return saran('fix', 'Kunci salah. Pastikan memakai baris <strong>anon / public</strong> (atau <strong>publishable</strong> pada dasbor baru), bukan <code>service_role</code>.');
    if (/relation .* does not exist|schema/i.test(txt)) return saran('fix', '<code>schema.sql</code> belum dijalankan, atau dijalankan di proyek Supabase yang berbeda. Buka SQL Editor dan jalankan isinya.');
    if (r.status === 404) return saran('fix', 'Tabel belum ada — jalankan <code>schema.sql</code> di SQL Editor proyek ini.');
    return saran('fix', 'Periksa pesan di atas. Bila menyebut RLS/policy, jalankan ulang bagian keamanan di <code>schema.sql</code>.');
  } catch (e) {
    add(false, 'Tidak dapat menghubungi Supabase', String(e));
    saran('fix', 'Periksa apakah <code>url</code> benar (harus diakhiri <code>.supabase.co</code>, tanpa garis miring) dan proyeknya tidak dijeda. Proyek gratis yang menganggur lebih dari seminggu akan <em>paused</em> — aktifkan lagi dari dasbor Supabase.');
  }
})();
</script>
</body>
</html>
